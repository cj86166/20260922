<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微光花園 · 免設定全球共享開心花園</title>

    <!-- Google Fonts 襯線體與無襯線體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. 全局變數定義：低飽和暖色調風格 (米白、淡杏、陶土、鼠尾草綠)
           ========================================================================== */
        :root {
            --bg-cream: #FDFBF7;
            --bg-card: rgba(255, 253, 249, 0.92);
            --border-warm: #EADFD3;
            --text-primary: #4A4238;
            --text-muted: #8C8275;

            /* 低飽和度花朵與植物色彩庫 */
            --color-terracotta: #D89880;
            --color-dusty-rose: #DBA99D;
            --color-warm-apricot: #E8C1A0;
            --color-mustard-soft: #D6A868;
            --color-sage-green: #90A08B;
            --color-stem-dark: #788873;
            --color-sand: #EFEAE2;

            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-soft: 0 10px 30px -8px rgba(180, 160, 140, 0.15);
            --shadow-floating: 0 20px 40px -12px rgba(130, 110, 95, 0.18);

            --font-serif: 'Noto Serif TC', serif;
            --font-sans: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 12% 15%, rgba(216, 152, 128, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 88% 85%, rgba(144, 160, 139, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
            line-height: 1.6;
        }

        /* 應用主容器 */
        .app-container {
            width: 100%;
            max-width: 960px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 標題與簡介 */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: 2.1rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.05em;
        }

        header p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 300;
        }

        /* 免設定全網即時連線標籤 */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(144, 160, 139, 0.15);
            color: #556B52;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            margin-top: 10px;
            border: 1px solid rgba(144, 160, 139, 0.3);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #6B8E65;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(107, 142, 101, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(107, 142, 101, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(107, 142, 101, 0); }
        }

        /* 輸入卡片樣式 */
        .input-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .input-card:focus-within {
            box-shadow: var(--shadow-floating);
            border-color: var(--color-dusty-rose);
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.7);
            resize: none;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        textarea:focus {
            background: #FFFFFF;
            border-color: var(--color-terracotta);
        }

        textarea::placeholder {
            color: #B5ACA0;
            font-family: var(--font-serif);
        }

        .form-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-counter {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .submit-btn {
            background: var(--color-terracotta);
            color: #FFFFFF;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-family: var(--font-serif);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(216, 152, 128, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #CA8A72;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(216, 152, 128, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 花園展示區域 */
        .garden-container {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(180deg, rgba(239, 234, 226, 0.3) 0%, rgba(239, 234, 226, 0.85) 100%);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 460px;
            box-shadow: inset 0 2px 8px rgba(180, 160, 140, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 花園控制標頭列 */
        .garden-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(234, 223, 211, 0.5);
            background: rgba(253, 251, 247, 0.6);
            backdrop-filter: blur(4px);
            z-index: 20;
        }

        .action-group {
            display: flex;
            gap: 10px;
        }

        .btn-text-link {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border-warm);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.82rem;
            font-family: var(--font-serif);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .btn-text-link:hover {
            background: #FFFFFF;
            border-color: var(--color-terracotta);
            color: var(--color-terracotta);
        }

        /* 花園地表劃線 */
        .ground-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(144, 160, 139, 0.2);
            border-top: 1px dashed var(--color-sage-green);
        }

        /* 花園畫布 */
        #garden-stage {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        /* 載入中與無資料提示 */
        .empty-garden-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .empty-garden-tip p {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* ==========================================================================
           2. SVG 花朵繪製與生長/微風搖曳動畫
           ========================================================================== */
        .flower-wrapper {
            position: absolute;
            bottom: 8px;
            transform-origin: bottom center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .flower-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            z-index: 50;
        }

        /* 花莖繪製動畫 */
        .stem-path {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: growStem 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes growStem {
            to { stroke-dashoffset: 0; }
        }

        /* 葉片舒展動畫 */
        .leaf-path {
            transform: scale(0);
            transform-origin: center;
            animation: unfoldLeaf 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes unfoldLeaf {
            to { transform: scale(1); }
        }

        /* 花朵綻放動畫 */
        .bloom-head {
            transform: scale(0) rotate(-10deg);
            transform-origin: center;
            opacity: 0;
            animation: bloom 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bloom {
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* 自然微風吹拂動畫 */
        .sway-slow { animation: sway 6s ease-in-out infinite; }
        .sway-medium { animation: sway 4.5s ease-in-out infinite 0.5s; }
        .sway-fast { animation: sway 3.5s ease-in-out infinite 1s; }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2.5deg); }
        }

        /* ==========================================================================
           3. 彈窗 (Modal) 與 側邊抽屜 (Drawer) 樣式
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 66, 56, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .story-card {
            background: var(--bg-cream);
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-floating);
            transform: scale(0.9) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            text-align: center;
        }

        .modal-overlay.active .story-card {
            transform: scale(1) translateY(0);
        }

        .story-card .date-badge {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        .story-card .story-content {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--text-primary);
            margin: 20px 0;
            line-height: 1.7;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
        }

        .like-btn {
            background: rgba(216, 152, 128, 0.12);
            border: 1px solid var(--color-dusty-rose);
            color: var(--color-terracotta);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .like-btn:hover {
            background: var(--color-terracotta);
            color: #FFFFFF;
        }

        .close-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-warm);
            color: var(--text-primary);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--border-warm);
        }

        /* 故事清單側邊抽屜 (Drawer) */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 66, 56, 0.2);
            backdrop-filter: blur(3px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-content {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: var(--bg-cream);
            box-shadow: -10px 0 30px rgba(0,0,0,0.08);
            z-index: 95;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .drawer-overlay.active .drawer-content {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-warm);
        }

        .drawer-header h2 {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 400;
        }

        .drawer-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .drawer-item {
            background: #FFFFFF;
            border: 1px solid var(--border-warm);
            border-radius: var(--radius-md);
            padding: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drawer-item:hover {
            border-color: var(--color-terracotta);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        .drawer-item .item-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .drawer-item .item-text {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            header h1 { font-size: 1.7rem; }
            .app-container { padding: 16px 12px; }
            .input-card { padding: 16px; }
            .garden-container { min-height: 380px; }
            .drawer-content { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頁面標頭區域 -->
        <header>
            <h1>微光花園</h1>
            <p>分享一件讓你微笑的小事，讓萬家心光在雲端綻放成溫暖花海</p>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span id="sync-status">免設定 · 全球心光連線中</span>
            </div>
        </header>

        <!-- 輸入喜悅與提交區域 -->
        <main class="input-card">
            <form id="happy-form" class="input-form">
                <textarea 
                    id="happy-input" 
                    maxlength="200" 
                    placeholder="寫下今天遇見的幸運、溫暖的對話或讓你開心的事情..."

                <div class="form-action">
                    <span id="char-count" class="char-counter">0 / 200 字</span>
                    <button type="submit" id="submit-btn" class="submit-btn">

        <!-- 花園容器區 -->
        <div class="garden-container">
            <div class="garden-bar">
                <span id="flower-count-text">正在載入雲端微光花園...</span>
                <div class="action-group">
                    <button id="refresh-btn" class="btn-text-link" title="同步最新花朵">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>

                    </button>
                    <button id="open-drawer-btn" class="btn-text-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        <span>大眾開心牆</span>
                    </button>
                </div>
            </div>

            <div id="garden-stage">
                <!-- 空花園提示 -->
                <div id="empty-tip" class="empty-garden-tip">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="margin: 0 auto; stroke: var(--text-muted);">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 15v6M9 18h6M12 9V3M9 6h6"/>
                    </svg>
                    <p>微光花園靜待著第一份溫暖的喜悅...</p>
                </div>
            </div>

            <!-- 地面裝飾劃線 -->
            <div class="ground-line"></div>
        </div>
    </div>

    <!-- 點擊花朵彈出的故事卡片 Modal -->
    <div id="story-modal" class="modal-overlay">
        <div class="story-card">
            <div id="modal-date" class="date-badge">2026.09.23</div>
            <div id="modal-content" class="story-content">...</div>
            <div class="card-actions">
                <button id="modal-like-btn" class="like-btn">
                    ♥ 溫暖打氣 (<span id="modal-like-count">0</span>)
                </button>
                <button id="modal-close" class="close-btn">關閉</button>
            </div>
        </div>
    </div>

    <!-- 故事清單側邊抽屜 -->
    <div id="story-drawer" class="drawer-overlay">
        <div class="drawer-content">
            <div class="drawer-header">
                <h2>大眾開心牆</h2>
                <button id="drawer-close" class="close-btn" style="padding: 4px 12px;">✕</button>
            </div>
            <div id="drawer-list" class="drawer-list">
                <!-- 動態注入心事卡片列表 -->
            </div>
        </div>
    </div>

        const modalClose = document.getElementById('modal-close');
        const modalLikeBtn = document.getElementById('modal-like-btn');
        const modalLikeCount = document.getElementById('modal-like-count');
        const openDrawerBtn = document.getElementById('open-drawer-btn');
        const drawerOverlay = document.getElementById('story-drawer');
        const drawerClose = document.getElementById('drawer-close');

        // 字數統計
        happyInput.addEventListener('input', (e) => {
            charCount.textContent = `${e.target.value.length} / 200 字`;
        });

        // 啟動應用與輪詢 (Polling)
        window.addEventListener('DOMContentLoaded', () => {
            fetchStories();
            // 每 8 秒自動背景定時輪詢最新雲端開心故事
            setInterval(fetchStories, 8000);
        });

        refreshBtn.addEventListener('click', () => {
            refreshBtn.querySelector('span').textContent = '同步中...';
            fetchStories().finally(() => {
                setTimeout(() => { refreshBtn.querySelector('span').textContent = '重新整理'; }, 600);
            });
        });

        /**
         * 讀取雲端開心故事數據 (包含自動降級機制)
         */
        async function fetchStories() {
            try {
                const response = await fetch(`${API_URL}?select=*&order=created_at.asc&limit=60`, {
                    headers: {
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`
                    }
                });

                if (!response.ok) throw new Error("API Network response was not ok");
                
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    globalStories = data.map(item => ({
                        id: item.id,
                        text: item.text,
                        date: item.date || '微光時刻',
                        likes: item.likes || 0,
                        flowerType: item.flower_type ?? 0,
                        paletteIdx: item.palette_idx ?? 0,
                        height: item.height || 200,
                        swayClass: item.sway_class || 'sway-slow'
                    }));
                } else {
                    // 若雲端暫無資料，融合 LocalStorage 與 Demo
                    loadFallbackStories();
                }

                document.getElementById('sync-status').textContent = '已即時連線全球心光花園';
            } catch (err) {
                console.warn("雲端讀取失敗，切換至優雅降級模式 (本地與示範花園)：", err);
                document.getElementById('sync-status').textContent = '本地與社群離線花園模式';
                loadFallbackStories();
            } finally {
                renderGarden();
                renderDrawerList();
            }
        }

        /**
         * 離線與優雅降級備用載入
         */
        function loadFallbackStories() {
            const localSaved = JSON.parse(localStorage.getItem('muted_garden_local_stories') || '[]');
            globalStories = [...DEMO_STORIES, ...localSaved];
        }

        /**
         * 提交新的開心故事
         */
        happyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = happyInput.value.trim();
            if (!text) return;

            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = '正在綻放...';

            // 根據字數與內容計算產生風格參數
            const dateStr = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');
            const flowerType = (text.length + Math.floor(Math.random() * 3)) % 5;
            const paletteIdx = Math.floor(Math.random() * PALETTES.length);
            const height = 180 + Math.min(text.length * 1.5, 90) + Math.random() * 30;
            const swayClass = ['sway-slow', 'sway-medium', 'sway-fast'][Math.floor(Math.random() * 3)];

            const newStory = {
                text: text,
                date: dateStr,
                likes: 0,
                flower_type: flowerType,
                palette_idx: paletteIdx,
                height: Math.round(height),
                sway_class: swayClass
            };

            try {
                // 發送到全球公共雲端
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify(newStory)
                });

                if (!response.ok) throw new Error("Post to cloud failed");
                await fetchStories(); // 重新整理
            } catch (err) {
                console.warn("無法上傳雲端，儲存至本地瀏覽器：", err);
                // 本地備用處理
                const localStory = {
                    id: 'local-' + Date.now(),
                    ...newStory,
                    flowerType: flowerType,
                    paletteIdx: paletteIdx,
                    swayClass: swayClass
                };
                const localSaved = JSON.parse(localStorage.getItem('muted_garden_local_stories') || '[]');
                localSaved.push(localStory);
                localStorage.setItem('muted_garden_local_stories', JSON.stringify(localSaved));
                globalStories.push(localStory);
                renderGarden();
                renderDrawerList();
            } finally {
                happyInput.value = '';
                charCount.textContent = '0 / 200 字';
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = '種下花朵';
            }
        });

        /**
         * 渲染畫面上的所有花朵
         */
        function renderGarden() {
            const stage = document.getElementById('garden-stage');
            const emptyTip = document.getElementById('empty-tip');
            const countText = document.getElementById('flower-count-text');

            // 清除現有花朵
            const oldFlowers = stage.querySelectorAll('.flower-wrapper');
            oldFlowers.forEach(el => el.remove());

            if (globalStories.length === 0) {
                emptyTip.style.opacity = '1';
                countText.textContent = '目前花園靜待著第一朵綻放的花';
                return;
            }

            emptyTip.style.opacity = '0';
            countText.textContent = `目前花園共有 ${globalStories.length} 朵為愛綻放的花朵`;

            const stageWidth = stage.clientWidth || 800;
            const existingXs = [];

            // 為每朵花分配位置並渲染
            globalStories.forEach((flower, index) => {
                const x = calculateDeterministicX(flower.id || String(index), index, stageWidth, existingXs);
                existingXs.push(x);

                const flowerEl = createFlowerElement(flower, x);
                stage.appendChild(flowerEl);
            });
        }

        /**
         * 確定性 X 軸散佈演算法 (防止花朵過度重疊)
         */
        function calculateDeterministicX(idStr, index, stageWidth, existingXs) {
            const padding = 35;
            const usableWidth = Math.max(stageWidth - padding * 2, 200);

            let hash = 0;
            for (let i = 0; i < idStr.length; i++) {
                hash = (hash << 5) - hash + idStr.charCodeAt(i);
                hash |= 0;
            }
            const normHash = Math.abs(hash % 1000) / 1000;
            let candidateX = padding + (normHash * usableWidth);

            // 重疊推開校正
            const minDistance = 42;
            for (let existing of existingXs) {
                if (Math.abs(existing - candidateX) < minDistance) {
                    candidateX = (candidateX + minDistance + (normHash * 25)) % usableWidth + padding;
                }
            }

            return candidateX;
        }

        /**
         * 創建 SVG 精緻花朵元件
         */
        function createFlowerElement(flower, xPos) {
            const wrapper = document.createElement('div');
            wrapper.className = `flower-wrapper ${flower.swayClass || 'sway-slow'}`;
            wrapper.style.left = `${xPos}px`;
            wrapper.style.bottom = '8px';

            const svgWidth = 100;
            const svgHeight = flower.height || 210;
            const p = PALETTES[flower.paletteIdx % PALETTES.length] || PALETTES[0];
            const flowerType = flower.flowerType || 0;

            let flowerHeadSVG = '';

            // 0: 鬱金香 (Tulip)
            if (flowerType === 0) {
                flowerHeadSVG = `
                    <g class="bloom-head" style="animation-delay: 0.8s;">
                        <path d="M50 45 C30 20, 25 -5, 50 15 C75 -5, 70 20, 50 45 Z" fill="${p.petalSoft}"/>
                        <path d="M38 45 C25 25, 30 5, 50 25 C70 5, 75 25, 62 45 Z" fill="${p.petal}"/>
                        <path d="M44 48 C38 32, 45 18, 50 28 C55 18, 62 32, 56 48 Z" fill="${p.center}"/>
                    </g>`;
            } 
            // 1: 小雛菊 (Daisy)
            else if (flowerType === 1) {
                let petals = '';
                const numPetals = 10;
                for (let i = 0; i < numPetals; i++) {
                    const angle = (360 / numPetals) * i;
                    petals += `<path d="M50 25 C44 10, 46 0, 50 0 C54 0, 56 10, 50 25 Z" fill="${p.petalSoft}" transform="rotate(${angle} 50 25)"/>`;
                }
                flowerHeadSVG = `
                    <g class="bloom-head" style="animation-delay: 0.8s;">
                        ${petals}
                        <circle cx="50" cy="25" r="7" fill="${p.center}"/>
                        <circle cx="50" cy="25" r="4" fill="${p.petal}" opacity="0.3"/>
                    </g>`;
            } 
            // 2: 野玫瑰 (Wild Rose)
            else if (flowerType === 2) {
                let petals = '';
                const numPetals = 5;
                for (let i = 0; i < numPetals; i++) {
                    const angle = (360 / numPetals) * i;
                    petals += `<path d="M50 30 C30 10, 40 -10, 50 5 C60 -10, 70 10, 50 30 Z" fill="${p.petal}" opacity="0.9" transform="rotate(${angle} 50 30)"/>`;
                }
                flowerHeadSVG = `
                    <g class="bloom-head" style="animation-delay: 0.8s;">
                        ${petals}
                        <circle cx="50" cy="30" r="6" fill="${p.center}"/>
                        <circle cx="50" cy="30" r="2.5" fill="${p.stem}"/>
                    </g>`;
            } 
            // 3: 鈴蘭/風鈴草 (Bellflower)
            else if (flowerType === 3) {
                flowerHeadSVG = `
                    <g class="bloom-head" style="animation-delay: 0.8s;">
                        <path d="M50 10 C30 20, 25 45, 38 50 C44 52, 48 42, 50 42 C52 42, 56 52, 62 50 C75 45, 70 20, 50 10 Z" fill="${p.petal}"/>
                        <path d="M42 48 C46 54, 54 54, 58 48" stroke="${p.center}" stroke-width="2" fill="none"/>
                    </g>`;
            } 
            // 4: 向日葵 (Sunflower)
            else {
                let petals = '';
                const numPetals = 12;
                for (let i = 0; i < numPetals; i++) {
                    const angle = (360 / numPetals) * i;
                    petals += `<path d="M50 28 C45 12, 48 2, 50 2 C52 2, 55 12, 50 28 Z" fill="${p.petal}" transform="rotate(${angle} 50 28)"/>`;
                }
                flowerHeadSVG = `
                    <g class="bloom-head" style="animation-delay: 0.8s;">
                        ${petals}
                        <circle cx="50" cy="28" r="9" fill="${p.stem}"/>
                        <circle cx="50" cy="28" r="7" fill="#605244"/>
                    </g>`;
            }

            wrapper.innerHTML = `
                <svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 100 ${svgHeight}" style="overflow: visible;">
                    <path class="stem-path" 
                          d="M50,${svgHeight} Q${45 + (flowerType % 2) * 10},${svgHeight / 2} 50,30" 
                          fill="none" 
                          stroke="${p.stem}" 
                          stroke-width="2.5" 
                          stroke-linecap="round"/>

                    <g class="leaf-path" style="animation-delay: 0.5s;">
                        <path d="M50,${svgHeight - 40} Q30,${svgHeight - 60} 25,${svgHeight - 75} Q42,${svgHeight - 65} 50,${svgHeight - 40}" 
                              fill="${p.stem}" opacity="0.85"/>
                    </g>

                    <g class="leaf-path" style="animation-delay: 0.7s;">
                        <path d="M50,${svgHeight - 80} Q70,${svgHeight - 100} 75,${svgHeight - 115} Q58,${svgHeight - 105} 50,${svgHeight - 80}" 
                              fill="${p.stem}" opacity="0.85"/>
                    </g>

                    ${flowerHeadSVG}
                </svg>
            `;

            wrapper.addEventListener('click', () => {
                openStoryModal(flower);
            });

            return wrapper;
        }

        /**
         * 渲染大眾開心牆列表
         */
        function renderDrawerList() {
            const drawerList = document.getElementById('drawer-list');
            drawerList.innerHTML = '';

            if (globalStories.length === 0) {
                drawerList.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 40px;">尚未有故事紀錄</div>';
                return;
            }

            // 最新貼文排在最前面
            const sorted = [...globalStories].reverse();

            sorted.forEach(item => {
                const card = document.createElement('div');
                card.className = 'drawer-item';
                card.innerHTML = `
                    <div class="item-meta">
                        <span>${item.date}</span>
                        <span>♥ ${item.likes}</span>
                    </div>
                    <div class="item-text">${escapeHtml(item.text)}</div>
                `;
                card.addEventListener('click', () => {
                    drawerOverlay.classList.remove('active');
                    openStoryModal(item);
                });
                drawerList.appendChild(card);
            });
        }

        /**
         * 開啟詳細卡片 Modal
         */
        function openStoryModal(story) {
            activeModalStory = story;
            document.getElementById('modal-date').textContent = story.date || '微光時刻';
            document.getElementById('modal-content').textContent = story.text;
            modalLikeCount.textContent = story.likes || 0;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            activeModalStory = null;
        }

        // 點擊 Modal 按讚給予溫暖
        modalLikeBtn.addEventListener('click', async () => {
            if (!activeModalStory) return;

            activeModalStory.likes = (activeModalStory.likes || 0) + 1;
            modalLikeCount.textContent = activeModalStory.likes;

            // 嘗試同步更新至 Supabase API
            if (activeModalStory.id && !String(activeModalStory.id).startsWith('demo') && !String(activeModalStory.id).startsWith('local')) {
                try {
                    await fetch(`${API_URL}?id=eq.${activeModalStory.id}`, {
                        method: "PATCH",
                        headers: {
                            "apikey": API_KEY,
                            "Authorization": `Bearer ${API_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ likes: activeModalStory.likes })
                    });
                } catch (e) {
                    console.warn("點讚同步暫緩", e);
                }
            }
            renderDrawerList();
        });

        // Modal 與 Drawer 開關事件
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        openDrawerBtn.addEventListener('click', () => drawerOverlay.classList.add('active'));
        drawerClose.addEventListener('click', () => drawerOverlay.classList.remove('active'));
        drawerOverlay.addEventListener('click', (e) => { if (e.target === drawerOverlay) drawerOverlay.classList.remove('active'); });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
